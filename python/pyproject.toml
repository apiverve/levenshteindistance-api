[project]
name = "apiverve-levenshteindistance"
version = "1.2.2"
authors = [
  { name="APIVerve", email="hello@apiverve.com" },
]
description = "Levenshtein Distance calculates the minimum number of single-character edits needed to transform one string into another."
keywords = ["levenshtein distance", "edit distance", "string similarity", "text comparison", "string matching"]
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
dependencies = [
    "requests>=2.25.0"
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
    "Intended Audience :: Developers",
    "Topic :: Internet :: WWW/HTTP",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Natural Language :: English",
]

[project.urls]
Homepage = "https://apiverve.com/marketplace/levenshteindistance?utm_source=pypi&utm_medium=referral&utm_content=homepage"
Documentation = "https://docs.apiverve.com/ref/levenshteindistance?utm_source=pypi&utm_medium=referral&utm_content=docs"
Repository = "https://github.com/apiverve/levenshteindistance-api"
Twitter = "https://twitter.com/apivervehq"
